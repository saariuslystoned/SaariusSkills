<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="motion-probes" content="latch_t008:t=0.08@1100,720;carry_occluded_t023:t=0.23@1100,720;scan_t045:t=0.45@1100,720;exploded_t023:t=0.23&explode=1@1100,720;release_t084:t=0.84@1100,720;mobile_390x844:t=0.45@390,844">
<title>Foundry Overhead Hoist — 3-Plate Multiplane Stage</title>
</head>
<body>
<script src="../multiplane.js"></script>
<script>
const RAIL_Y = 88;
const X_INTAKE = 210;
const X_SCAN = 560;
const X_DISPATCH = 930;

function trolleyX(t){
  if (t < 0.12) return X_INTAKE;
  if (t < 0.34) return X_INTAKE + (X_SCAN - X_INTAKE) * smooth7(0.12, 0.34, t);
  if (t < 0.54) return X_SCAN;
  if (t < 0.76) return X_SCAN + (X_DISPATCH - X_SCAN) * smooth7(0.54, 0.76, t);
  if (t < 0.86) return X_DISPATCH;
  return X_DISPATCH + (X_INTAKE - X_DISPATCH) * smooth7(0.86, 0.98, t);
}

function chainDrop(t){
  // Vertical payout distance from trolley sheave (y = RAIL_Y + 26) to hook clevis
  const HIGH = 82;
  const LOW_INTAKE = 196;
  const LOW_SCAN = 172;
  const LOW_DISPATCH = 192;
  if (t < 0.05) return HIGH + (LOW_INTAKE - HIGH) * smooth7(0.00, 0.05, t);
  if (t < 0.12) return LOW_INTAKE + (HIGH - LOW_INTAKE) * smooth7(0.06, 0.12, t);
  if (t < 0.34) return HIGH;
  if (t < 0.41) return HIGH + (LOW_SCAN - HIGH) * smooth7(0.34, 0.41, t);
  if (t < 0.48) return LOW_SCAN;
  if (t < 0.54) return LOW_SCAN + (HIGH - LOW_SCAN) * smooth7(0.48, 0.54, t);
  if (t < 0.76) return HIGH;
  if (t < 0.82) return HIGH + (LOW_DISPATCH - HIGH) * smooth7(0.76, 0.82, t);
  if (t < 0.87) return LOW_DISPATCH + (HIGH - LOW_DISPATCH) * smooth7(0.82, 0.87, t);
  return HIGH;
}

const sampleSwing = preintegratePeriodicPendulum(trolleyX, {
  steps: 720,
  duration: 12,
  wn: 5.4,
  zeta: 0.34,
  driveScale: 0.0018,
  maxDeg: 18
});

function renderChainLinks(x, y0, y1, color){
  const out = [];
  const step = 11;
  let idx = 0;
  for (let y = y0; y <= y1 - 6; y += step, idx++){
    if (idx % 2 === 0){
      out.push(`<rect x="${(x - 3.2).toFixed(1)}" y="${y.toFixed(1)}" width="6.4" height="9.5" rx="3" fill="none" stroke="${color}" stroke-width="2.1"/>`);
    } else {
      out.push(`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x.toFixed(1)}" y2="${(y + 9.5).toFixed(1)}" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/>`);
    }
  }
  return out.join('');
}

function renderCanister(cx, cy, scanGlow){
  return `
    <g transform="translate(${cx.toFixed(1)}, ${cy.toFixed(1)})">
      <path d="M -12 -6 L -8 -16 L 8 -16 L 12 -6 Z" fill="#8b99a8" stroke="#141c24" stroke-width="2"/>
      <circle cx="0" cy="-11" r="3.6" fill="#141c24"/>
      <rect x="-34" y="-6" width="68" height="54" rx="8" fill="#d97724" stroke="#141c24" stroke-width="2.4"/>
      <rect x="-34" y="6" width="68" height="12" fill="#f3b340" opacity="0.9"/>
      <rect x="-24" y="24" width="48" height="16" rx="3" fill="#18222c"/>
      <circle cx="-14" cy="32" r="3.2" fill="${scanGlow > 0.2 ? '#4ade80' : '#38bdf8'}"/>
      <rect x="-6" y="30" width="24" height="4" rx="2" fill="#94a3b8"/>
    </g>
  `;
}

mountMultiplane({
  title: 'Foundry Overhead Gantry Hoist',
  ariaLabel: 'Three-plane foundry gantry hoist transporting a sealed canister across intake, laser verification, and dispatch stations',
  eyebrow: 'PIPELINE STAGE',
  viewBox: [1200, 520],
  duration: 12,
  pigment: { enabled: false },
  stops: [
    { id: 'intake',   label: 'Intake Cradle',    at: 0.08, etaMin: 4 },
    { id: 'transit',  label: 'Gantry Span',      at: 0.24, etaMin: 3 },
    { id: 'verify',   label: 'Laser Verify',     at: 0.45, etaMin: 1 },
    { id: 'dispatch', label: 'Dispatch Chute',   at: 0.82, etaMin: 0 }
  ],
  background(st, t, ctx){
    const pfx = ctx.idPrefix;
    const intakeBloom = (1 - smooth7(0.08, 0.20, t)) * 0.65 + smooth7(0.92, 1.0, t) * 0.65;
    const scanBloom = smooth7(0.36, 0.42, t) * (1 - smooth7(0.48, 0.54, t));
    const dispatchBloom = smooth7(0.78, 0.84, t) * (1 - smooth7(0.92, 0.98, t));

    return `
      <defs>
        <linearGradient id="${pfx}-bay-wall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#111923"/>
          <stop offset="68%" stop-color="#182433"/>
          <stop offset="100%" stop-color="#0f1720"/>
        </linearGradient>
        <radialGradient id="${pfx}-amber-bloom" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.58"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="${pfx}-cyan-bloom" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.62"/>
          <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="${pfx}-emerald-bloom" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#34d399" stop-opacity="0.58"/>
          <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x="0" y="0" width="1200" height="520" fill="url(#${pfx}-bay-wall)"/>
      <!-- High-bay clerestory windows -->
      <g opacity="0.28">
        <rect x="80" y="22" width="210" height="36" rx="4" fill="#334b68"/>
        <rect x="330" y="22" width="210" height="36" rx="4" fill="#334b68"/>
        <rect x="580" y="22" width="210" height="36" rx="4" fill="#334b68"/>
        <rect x="830" y="22" width="290" height="36" rx="4" fill="#334b68"/>
      </g>
      <!-- Overhead hoist I-beam rail -->
      <rect x="40" y="${RAIL_Y - 12}" width="1120" height="22" fill="#273649" stroke="#0c1219" stroke-width="2"/>
      <line x1="40" y1="${RAIL_Y - 1}" x2="1160" y2="${RAIL_Y - 1}" stroke="#49627e" stroke-width="2"/>
      <!-- Shop floor deck -->
      <rect x="0" y="424" width="1200" height="96" fill="#121a24"/>
      <line x1="0" y1="424" x2="1200" y2="424" stroke="#33475e" stroke-width="2.5"/>

      <!-- Station 1: Intake Cradle -->
      <g transform="translate(${X_INTAKE}, 368)">
        <rect x="-74" y="0" width="148" height="56" rx="6" fill="#202d3c" stroke="#0d141c" stroke-width="2.2"/>
        <path d="M -52 0 L -40 -18 L -24 -18 L -18 0 M 52 0 L 40 -18 L 24 -18 L 18 0" fill="#394e66" stroke="#0d141c" stroke-width="2"/>
        <rect x="-46" y="18" width="92" height="10" rx="3" fill="#f59e0b" opacity="${(0.35 + intakeBloom * 0.6).toFixed(2)}"/>
      </g>

      <!-- Station 2: Laser Verification Gate -->
      <g transform="translate(${X_SCAN}, 346)">
        <rect x="-86" y="22" width="172" height="56" rx="6" fill="#202d3c" stroke="#0d141c" stroke-width="2.2"/>
        <rect x="-72" y="-58" width="16" height="80" rx="3" fill="#2c3e52" stroke="#0d141c" stroke-width="2"/>
        <rect x="56" y="-58" width="16" height="80" rx="3" fill="#2c3e52" stroke="#0d141c" stroke-width="2"/>
        <circle cx="-64" cy="-34" r="5" fill="#38bdf8"/>
        <circle cx="64" cy="-34" r="5" fill="#38bdf8"/>
      </g>

      <!-- Station 3: Outbound Dispatch Chute & Roller Bed -->
      <g transform="translate(${X_DISPATCH}, 368)">
        <rect x="-78" y="0" width="196" height="56" rx="6" fill="#202d3c" stroke="#0d141c" stroke-width="2.2"/>
        <circle cx="-48" cy="-4" r="6" fill="#64748b" stroke="#0d141c" stroke-width="1.8"/>
        <circle cx="-16" cy="-4" r="6" fill="#64748b" stroke="#0d141c" stroke-width="1.8"/>
        <circle cx="16" cy="-4" r="6" fill="#64748b" stroke="#0d141c" stroke-width="1.8"/>
        <circle cx="48" cy="-4" r="6" fill="#64748b" stroke="#0d141c" stroke-width="1.8"/>
        <circle cx="80" cy="-4" r="6" fill="#64748b" stroke="#0d141c" stroke-width="1.8"/>
      </g>

      <!-- Screen-blended reactive light blooms synced to station phase -->
      <circle cx="${X_INTAKE}" cy="340" r="150" fill="url(#${pfx}-amber-bloom)" opacity="${intakeBloom.toFixed(3)}" style="mix-blend-mode:screen"/>
      <circle cx="${X_SCAN}" cy="312" r="175" fill="url(#${pfx}-cyan-bloom)" opacity="${scanBloom.toFixed(3)}" style="mix-blend-mode:screen"/>
      <circle cx="${X_DISPATCH}" cy="340" r="165" fill="url(#${pfx}-emerald-bloom)" opacity="${dispatchBloom.toFixed(3)}" style="mix-blend-mode:screen"/>
    `;
  },
  midground(st, t){
    const tx = trolleyX(t);
    const drop = chainDrop(t);
    const swing = sampleSwing(t);
    const attached = t >= 0.05 && t < 0.82;
    const scanBeam = smooth7(0.38, 0.42, t) * (1 - smooth7(0.47, 0.51, t));

    const sheaveY = RAIL_Y + 26;
    const sheaveAngle = ((tx * 0.9 + drop * 1.6) % 360).toFixed(1);
    const slackDepth = Math.max(18, 86 - (drop - 82) * 0.48);

    // Waiting or dispatched canister states when unlatched from hook
    let freeCanisterSvg = '';
    if (t < 0.05){
      freeCanisterSvg = renderCanister(X_INTAKE, 326, 0);
    } else if (t >= 0.82){
      const rollProgress = smooth7(0.83, 0.96, t);
      const rollX = X_DISPATCH + rollProgress * 128;
      const fade = 1 - smooth7(0.93, 0.99, t);
      freeCanisterSvg = `<g opacity="${fade.toFixed(3)}">${renderCanister(rollX, 320, 1)}</g>`;
    }

    // Pendulum-coupled chain & hook assembly
    const hookPivotY = sheaveY + 12;
    const chainLen = drop;
    const latchAngle = attached ? 0 : 22;

    const laserSvg = scanBeam > 0.02 ? `
      <g opacity="${scanBeam.toFixed(3)}">
        <line x1="${X_SCAN - 58}" y1="312" x2="${X_SCAN + 58}" y2="312" stroke="#38bdf8" stroke-width="3.2"/>
        <rect x="${X_SCAN - 42}" y="294" width="84" height="36" fill="#38bdf8" opacity="0.16"/>
      </g>
    ` : '';

    return `
      ${freeCanisterSvg}
      <!-- Motorized overhead trolley carriage on Plane 02 -->
      <g transform="translate(${tx.toFixed(2)}, ${RAIL_Y})">
        <rect x="-38" y="-18" width="76" height="34" rx="6" fill="#e2a03f" stroke="#101720" stroke-width="2.4"/>
        <circle cx="-22" cy="-12" r="7.5" fill="#475569" stroke="#101720" stroke-width="2"/>
        <circle cx="22" cy="-12" r="7.5" fill="#475569" stroke="#101720" stroke-width="2"/>
        <!-- Slack chain loop beside hoist housing -->
        <path d="M 16 16 Q 28 ${(16 + slackDepth).toFixed(1)} 34 16" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 3"/>
        <!-- Grooved hoist sheave wheel -->
        <g transform="translate(0, 26) rotate(${sheaveAngle})">
          <circle cx="0" cy="0" r="13" fill="#64748b" stroke="#101720" stroke-width="2.2"/>
          <line x1="-10" y1="0" x2="10" y2="0" stroke="#101720" stroke-width="2.2"/>
          <line x1="0" y1="-10" x2="0" y2="10" stroke="#101720" stroke-width="2.2"/>
          <circle cx="0" cy="0" r="4" fill="#e2e8f0"/>
        </g>
      </g>

      <!-- Damped harmonic pendulum load chain + hook + latched canister -->
      <g transform="translate(${tx.toFixed(2)}, ${hookPivotY.toFixed(1)}) rotate(${swing.thetaDeg.toFixed(2)})">
        ${renderChainLinks(0, 0, chainLen - 12, '#cbd5e1')}
        <g transform="translate(0, ${chainLen.toFixed(1)})">
          <rect x="-9" y="-12" width="18" height="14" rx="4" fill="#f59e0b" stroke="#101720" stroke-width="2"/>
          <path d="M 0 2 C 10 2, 12 16, 0 18 C -9 18, -10 11, -5 8" fill="none" stroke="#e2e8f0" stroke-width="3.6" stroke-linecap="round"/>
          <line x1="-4" y1="2" x2="-6" y2="10" stroke="#f59e0b" stroke-width="2.2" transform="rotate(${latchAngle}, -4, 2)"/>
          ${attached ? renderCanister(0, 26, scanBeam) : ''}
        </g>
      </g>
      ${laserSvg}
    `;
  },
  foreground(){
    // Foreground steel gantry columns & cross-braced archways that occlude Plane 02
    const column = x => `
      <g transform="translate(${x}, 0)">
        <rect x="-22" y="48" width="44" height="392" fill="#0d141d" stroke="#2c3e54" stroke-width="2"/>
        <line x1="-16" y1="64" x2="16" y2="112" stroke="#243447" stroke-width="3"/>
        <line x1="16" y1="112" x2="-16" y2="160" stroke="#243447" stroke-width="3"/>
        <line x1="-16" y1="160" x2="16" y2="208" stroke="#243447" stroke-width="3"/>
        <line x1="16" y1="208" x2="-16" y2="256" stroke="#243447" stroke-width="3"/>
        <line x1="-16" y1="256" x2="16" y2="304" stroke="#243447" stroke-width="3"/>
        <line x1="16" y1="304" x2="-16" y2="352" stroke="#243447" stroke-width="3"/>
        <rect x="-32" y="424" width="64" height="18" rx="3" fill="#1b2838" stroke="#394f69" stroke-width="2"/>
      </g>
    `;
    return `
      <!-- Foreground upper girder fascia -->
      <rect x="0" y="0" width="1200" height="52" fill="#0b1118"/>
      <line x1="0" y1="52" x2="1200" y2="52" stroke="#2c3e54" stroke-width="2.5"/>
      ${column(376)}
      ${column(748)}
    `;
  }
});
</script>
</body>
</html>
