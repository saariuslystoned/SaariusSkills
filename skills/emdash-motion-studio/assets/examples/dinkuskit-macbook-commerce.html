<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="motion-probes" content="01_closed_lid_t0:free=1&yaw=45&t=0@960,820;02_step1_lid_open_order_in:free=1&yaw=45&step=1@960,820;03_cutaway_xr_front_labels:free=1&yaw=45&xr=1&labels=1&step=2@960,820;04_cutaway_xr_back_labels:free=1&yaw=225&xr=1&labels=1&step=2@960,820;05_step3_product_drop_open_box:free=1&yaw=45&step=3@960,820;06_step4_taped_thermal_label_slapped:free=1&yaw=45&step=4@960,820;07_step5_mail_chute_completed:free=1&yaw=45&step=5@960,820;08_mobile_390x844:free=1&yaw=45&xr=1&labels=1&step=4&vw=390@390,844">
  <title>DinkusKit — Commerce Inside the MacBook</title>
  <style>
    /* DinkusKit Studio Paper & Ink (Aizome) Palette with light-dark() Token Support */
    :root, .emdash-motion-stage {
      color-scheme: light;
      --color-canvas: light-dark(#f4f1ea, #121722);
      --color-surface: light-dark(#ebe5d8, #1a2232);
      --color-ink: light-dark(#1b222c, #eaeff7);
      --color-muted: light-dark(#5f6b7a, #94a3b8);
      --color-border: light-dark(#d5cec0, #2c384e);
      --color-accent: light-dark(#2b5b9e, #4b83d1);
      --color-shadow: light-dark(#3b5078, #090d14);
    }
    :root[data-theme="dark"], .dark, .emdash-motion-stage[data-theme="dark"] {
      color-scheme: dark;
    }
    .dk-choreo-bar {
      width: 100%;
      max-width: 760px;
      margin: 4px 0 12px;
      padding: 10px 14px;
      border: 1.5px solid var(--ink, #1b222c);
      border-radius: 12px;
      background: color-mix(in srgb, var(--paper, #f4f1ea) 92%, var(--ink, #1b222c));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dk-cues {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .dk-cue {
      all: unset;
      cursor: pointer;
      box-sizing: border-box;
      padding: 5px 6px;
      border-radius: 7px;
      border: 1.2px solid var(--rule, #d5cec0);
      background: var(--paper, #f4f1ea);
      color: var(--muted, #5f6b7a);
      font: 700 10px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
      transition: all .15s ease;
    }
    .dk-cue:hover {
      border-color: var(--ink, #1b222c);
      color: var(--ink, #1b222c);
    }
    .dk-cue[data-active="true"] {
      background: var(--ink, #1b222c);
      color: var(--paper, #f4f1ea);
      border-color: var(--ink, #1b222c);
    }
    .dk-cue[data-passed="true"] {
      border-color: var(--accent, #2b5b9e);
      color: var(--ink, #1b222c);
    }
    .dk-scrub {
      display: flex;
      align-items: center;
      gap: 10px;
      font: 700 10.5px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted, #5f6b7a);
    }
    .dk-scrub input[type="range"] {
      flex: 1;
      accent-color: var(--accent, #2b5b9e);
      cursor: pointer;
    }
    [data-chrome="stage-only"] .dk-choreo-bar {
      display: none !important;
    }
    @media (max-width: 560px) {
      .dk-cues {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
<script src="core.js"></script>
<script src="multiplane.js"></script>
<script src="choreo.js"></script>
<script>
/* ============================================================
   DinkusKit Flagship Benchmark — "Commerce Inside the MacBook"
   Combines all three EmDash Motion Studio engines in one cohesive stage:
   1. Mode A (core.js): Interactive 3D Isometric Cutaway of a MacBook Pro,
      Pitney Bowes 4x6 Thermal Label Printer, Open-Top Corrugated Shipping Box
      (openShell + 4 hinged flaps + kraft tape), Ordered DinkusKit Ceramic Kettle,
      and Outgoing Mail Chute on a studio board.
      In See-through mode (?xr=1), the MacBook unibody and printer shells ghost
      to expose a 38-part miniature "Commerce Factory" wired port-to-port:
        - CLOUDFLARE EDGE turbine & fiber ingress router
        - MARKETING FUNNEL hopper & COUPON STAMP PRESS (-20% SAVE20 actuator)
        - STRIPE VAULT rotary payment gate & 3 settlement ledger cylinders
        - D1 INVENTORY RACK 3-tier carousel & SKU picker chute (-1 SKU)
        - EMAIL PNEUMATIC TUBE compressor & glowing receipt capsule launcher
        - USB-C BUS controller, braided USB-C cable, LABEL ROLL & THERMAL PRINT HEAD
   2. Mode B (multiplane.js): 3-Layer Multiplane Occlusion + Aizome Pigment Drift
      skyline backdrop behind the desk where the outbound courier van travels
      from the Dispatch Hub to the Customer Doorstep behind foreground bridge trusses.
   3. Mode C (choreo.js): 5-Cue normalized timeline choreography (t in 0..1)
      with subRange / easeInOutCubic interpolation, live telemetry HUD, and
      deterministic ?t=0..1 and ?step=0..5 verification hooks.
   ============================================================ */

const BW = 108, BD = 160, BH = 4, H = 72;
const BTOP = boardTop(0, 0, BW, BD, BH, 6);

// Studio Aizome & Craft Materials
const AIZOME = { l:'#3568b0', m:'#234982', d:'#132a4f' };
const ALUM   = { l:'#e8ecf0', m:'#c5cdd6', d:'#8994a0' };
const SPACE  = { l:'#626b75', m:'#454d56', d:'#282d33' };
const KRAFT  = { l:'#dfa668', m:'#c2894d', d:'#8a5c2d' };
const TAPE_M = { l:'#edd09d', m:'#d4b279', d:'#9c7e4c' };
const BRASS  = { l:'#f2c96b', m:'#cf9f3e', d:'#8c651c' };
const STRIPE = { l:'#55d69e', m:'#2ea874', d:'#186343' };
const CF_ORG = { l:'#f79640', m:'#db6f18', d:'#8f4208' };
const CRIM   = { l:'#ed5f55', m:'#c73e35', d:'#7a1f19' };
const PCB_M  = { l:'#3b8c6e', m:'#266950', d:'#143d2e' };

const CUES = [
  { id: 'step1', step: 1, at: 0.18, range: [0.02, 0.22], short: '1 · Order In',    label: '1. Open MacBook & Order In',      summary: 'MacBook lid hinges open (0°→110°), DinkusKit storefront lights up, and Coupon Stamp Press stamps -20%.' },
  { id: 'step2', step: 2, at: 0.36, range: [0.22, 0.42], short: '2 · Stripe Paid', label: '2. Authorize Stripe Payment',     summary: 'Cloudflare Edge turbine spins up and Stripe Vault gate unlocks PAID ($68.00 net settled).' },
  { id: 'step3', step: 3, at: 0.56, range: [0.42, 0.62], short: '3 · Pack Box',    label: '3. Pick Inventory & Pack Box',    summary: 'D1 Inventory Rack decrements -1 SKU, Email Pneumatic Tube fires receipt, and product drops into open box.' },
  { id: 'step4', step: 4, at: 0.78, range: [0.62, 0.82], short: '4 · Tape & Label',label: '4. Tape Box & Slap Thermal Label',summary: '4 box flaps fold shut, kraft tape seals the seam, and Pitney Bowes printer slaps a 4×6 barcode label on top.' },
  { id: 'step5', step: 5, at: 0.96, range: [0.82, 1.00], short: '5 · Mail Chute',  label: '5. Throw in the Mail',            summary: 'Sealed & labeled parcel launches into the outgoing mail chute and courier van delivers to customer: COMPLETED.' },
];

const STEP_TIMES = { 0: 0.00, 1: 0.18, 2: 0.36, 3: 0.56, 4: 0.78, 5: 0.96 };

/* Derive all physical degrees of freedom purely from normalized timeline t (0..1) */
function deriveKinematics(t){
  const u = clamp01(t);
  return {
    t: u,
    // Step 1: Lid hinges open 0 -> 110 deg; marketing traffic & coupon stamp press (-20%)
    lidOpen: easeInOutCubic(subRange(u, 0.01, 0.14)),
    screenOn: easeInOutCubic(subRange(u, 0.06, 0.16)),
    couponStamp: Math.sin(subRange(u, 0.08, 0.19) * Math.PI),
    couponApplied: easeInOutCubic(subRange(u, 0.11, 0.17)),
    // Step 2: Cloudflare Edge rotor & Stripe Vault payment gate + ledger cylinders
    edgeSpin: u > 0.04 ? u * 12 : 0,
    stripeGate: easeInOutCubic(subRange(u, 0.21, 0.34)),
    stripePaid: u >= 0.28 ? 1 : easeInOutCubic(subRange(u, 0.21, 0.28)),
    // Step 3: D1 Inventory Rack SKU slide + Email Pneumatic capsule + Product lift & drop into open box
    skuPick: easeInOutCubic(subRange(u, 0.40, 0.52)),
    emailPulse: subRange(u, 0.41, 0.56),
    emailSent: u >= 0.50 ? 1 : 0,
    packProgress: easeInOutCubic(subRange(u, 0.40, 0.56)),
    // Step 4: 4 box flaps fold 0 -> 90 deg, kraft tape strip seals seam, thermal label prints & slaps onto box
    flapFold: easeInOutCubic(subRange(u, 0.58, 0.66)),
    tapeSeal: easeInOutCubic(subRange(u, 0.65, 0.71)),
    printHeat: Math.sin(subRange(u, 0.66, 0.78) * Math.PI),
    labelFlight: easeInOutCubic(subRange(u, 0.68, 0.77)),
    // Step 5: Packed, taped, labeled box launches into outgoing mail chute + multiplane delivery van
    mailLaunch: easeInOutCubic(subRange(u, 0.81, 0.95)),
    chuteFlap: Math.sin(subRange(u, 0.85, 0.96) * Math.PI),
    vanTransit: easeInOutCubic(subRange(u, 0.78, 0.98)),
  };
}

const boxOfPts = (pts, pad = 0.4) => [
  [0,1,2].map(i => Math.min(...pts.map(p => p[i])) - pad),
  [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + pad),
];

function wireSegs(pts, col, w = 0.45){
  const out = [];
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i + 1], seg = [a, b], d = pd(seg, false);
    const svg = `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + 0.9)}" stroke-linecap="round"/>`
      + `<path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round"/>`;
    out.push({ box: boxOfPts(seg, 0.3), svg });
  }
  return out;
}

/* ---------- MODE B BACKDROP: 3-Layer Multiplane Horizon + Pigment Drift ---------- */
function renderMultiplaneBackdrop(st, K){
  const t = K.t;
  const pig = renderPigmentDrift({
    width: 680,
    height: 120,
    idPrefix: 'dk-mp',
    position: 'full',
    opacity: 0.36,
    colors: ['#1b365d', '#2b5b9e', '#5a87c2', '#d9cbb8', '#f4f1ea'],
  }, t);

  // Plane 0: Distant fulfillment skyline & cloud bands
  const bg = `
    <g opacity="0.82">
      <rect x="18" y="64" width="38" height="44" fill="#cad4e0" stroke="${INK}" stroke-width="1"/>
      <rect x="62" y="52" width="52" height="56" fill="#d8e0ea" stroke="${INK}" stroke-width="1"/>
      <rect x="122" y="68" width="34" height="40" fill="#c3cedb" stroke="${INK}" stroke-width="1"/>
      <path d="M 488 108 L 488 64 L 520 48 L 552 64 L 552 108 Z" fill="#d5ded8" stroke="${INK}" stroke-width="1"/>
      <rect x="562" y="60" width="68" height="48" fill="#dce3ec" stroke="${INK}" stroke-width="1"/>
      <rect x="0" y="96" width="680" height="5" fill="#7c8ea0" stroke="${INK}" stroke-width="1"/>
    </g>
  `;

  // Plane 1 (Animated Midground): Inbound traffic pulses (left) + Outbound DinkusKit Courier Van (center->right)
  const vanX = 165 + K.vanTransit * 395;
  const pulseX = 24 + ((t * 3.2) % 1) * 110;
  const mid = `
    <g id="dk-mp-midground">
      <!-- Inbound customer traffic pulse -->
      <circle cx="${f(pulseX)}" cy="94" r="3.5" fill="#f79640" stroke="${INK}" stroke-width="1"/>
      <!-- Outbound DinkusKit Delivery Van on elevated viaduct -->
      <g transform="translate(${f(vanX)}, 80)">
        <rect x="0" y="2" width="34" height="14" rx="2.5" fill="${ K.mailLaunch > 0.1 ? '#2b5b9e' : '#637385' }" stroke="${INK}" stroke-width="1.2"/>
        <path d="M 34 6 L 43 6 L 46 11 L 46 16 L 34 16 Z" fill="#3568b0" stroke="${INK}" stroke-width="1.2"/>
        <rect x="36" y="7.5" width="7" height="4.5" fill="#fff6d6" stroke="${INK}" stroke-width="0.8"/>
        <rect x="4" y="6" width="24" height="3" fill="#f4b829"/>
        <circle cx="9" cy="16.5" r="3" fill="${INK}"/>
        <circle cx="37" cy="16.5" r="3" fill="${INK}"/>
      </g>
    </g>
  `;

  // Plane 2 (Foreground Occlusion Masks): Viaduct steel truss spans & suspension pylons that the van passes BEHIND
  let trusses = '';
  for (let x = 190; x <= 530; x += 68){
    trusses += `<rect x="${x}" y="72" width="7" height="36" fill="#8fa1b3" stroke="${INK}" stroke-width="1.1"/>`;
    trusses += `<path d="M ${x - 16} 74 L ${x + 3.5} 62 L ${x + 23} 74 Z" fill="#b7c4d1" stroke="${INK}" stroke-width="1"/>`;
  }
  const fg = `
    <g id="dk-mp-foreground">
      ${trusses}
      <rect x="150" y="72" width="420" height="4" fill="#596a7a" stroke="${INK}" stroke-width="1"/>
    </g>
  `;

  // Frame positioned at top center of main SVG viewBox (vbW ≈ 314, vbH ≈ 235) between .actions and .stats
  const badgeCol = K.mailLaunch > 0.8 ? '#2ea874' : K.stripePaid > 0.5 ? '#2b5b9e' : '#5f6b7a';
  const badgeTxt = K.mailLaunch > 0.8 ? 'DELIVERED · COMPLETED' : K.mailLaunch > 0.05 ? 'COURIER IN TRANSIT' : K.stripePaid > 0.5 ? 'FULFILLING ORDER #1042' : 'AWAITING ORDER';
  return `
    <g id="dk-multiplane-stage" transform="translate(85, 3) scale(0.285)">
      <defs>
        <clipPath id="dk-mp-clip"><rect x="0" y="0" width="540" height="88" rx="10"/></clipPath>
      </defs>
      <g clip-path="url(#dk-mp-clip)">
        <g transform="scale(0.794, 0.78)">
          ${pig}
          ${bg}
          ${mid}
          ${fg}
        </g>
      </g>
      <rect x="0" y="0" width="540" height="88" rx="10" fill="none" stroke="${INK}" stroke-width="2.6"/>
      <rect x="10" y="8" width="184" height="20" rx="5" fill="#f4f1ea" fill-opacity="0.94" stroke="#1b222c" stroke-width="1.4"/>
      <text x="102" y="21.5" text-anchor="middle" font-size="9.2" font-family="ui-monospace,Menlo,monospace" font-weight="800" fill="#1b222c" letter-spacing=".05em">MULTIPLANE DISPATCH LANE</text>
      <rect x="352" y="8" width="178" height="20" rx="5" fill="${badgeCol}" stroke="#1b222c" stroke-width="1.4"/>
      <text x="441" y="21.5" text-anchor="middle" font-size="9.0" font-family="ui-monospace,Menlo,monospace" font-weight="800" fill="#ffffff" letter-spacing=".05em">${badgeTxt}</text>
    </g>
  `;
}

/* ---------- 38-PART MINIATURE "COMMERCE FACTORY" INSIDE MACBOOK & PRINTER ---------- */
function commerceMech(st, K){
  const parts = [];
  const put = (b, svg) => parts.push({ box: b, svg });
  const bx = (x0, y0, z0, x1, y1, z1, m, w = 0.75) =>
    put([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, m, toneI, w));
  const vc = (x, y, z0, z1, r, m, w = 0.8, n = 16) =>
    put([[x - r, y - r, z0], [x + r, y + r, z1]], cyl(x, y, z0, z1, r, m, toneI, w, n));

  // ---- 1. CHASSIS FLOOR, POWER RAIL, HEATPIPE & CENTRAL SOC (Parts 1-4) ----
  bx(25.5, 95.5, BH + 0.3, 70.5, 150.5, BH + 0.8, SPACE, 0.8);                        // Part 1: CNC Unibody floor plate
  bx(26.2, 143, BH + 0.8, 29.5, 149.5, BH + 3.4, BRASS, 0.7);                         // Part 2: MagSafe / DC power bus block
  bx(26.2, 98, BH + 3.2, 28.4, 142, BH + 4.4, matOf('#b87343'), 0.7);                 // Part 3: Copper thermal heatpipe manifold
  bx(43, 116, BH + 0.8, 52, 125, BH + 2.4, DARK, 0.8);                                // Part 4: DinkusKit Commerce SoC die

  // ---- 2. MODULE 1: CLOUDFLARE EDGE TURBINE & ROUTER (x=28..41, y=132..149, Parts 5-10) ----
  const cfActive = K.lidOpen > 0.3;
  bx(24.2, 139, BH + 1.2, 27.2, 144, BH + 3.8, METAL, 0.7);                           // Part 5: Rear fiber ingress port
  bx(28.5, 139, BH + 0.8, 34.0, 147.5, BH + 4.2, cfActive ? CF_ORG : SPACE, 0.75);    // Part 6: Edge router gateway block
  vc(37.5, 137.5, BH + 0.8, BH + 4.4, 3.6, ALUM, 0.85, 18);                           // Part 7: Cloudflare Edge turbine stator ring
  // Part 8: Spinning axial turbine rotor hub + 6 vanes
  {
    const cx = 37.5, cy = 137.5, cz = BH + 4.5, ang0 = K.edgeSpin;
    let vanes = cyl(cx, cy, BH + 4.4, BH + 5.3, 1.5, CF_ORG, toneI, 0.7, 12);
    for (let i = 0; i < 6; i++){
      const a = ang0 + (i / 6) * Math.PI * 2;
      vanes += line([[cx + 1.2*Math.cos(a), cy + 1.2*Math.sin(a), cz + 0.3], [cx + 3.2*Math.cos(a), cy + 3.2*Math.sin(a), cz + 0.3]], 0.9);
    }
    put([[cx - 3.6, cy - 3.6, BH + 4.4], [cx + 3.6, cy + 3.6, BH + 5.5]], vanes);
  }
  vc(30.5, 134, BH + 0.8, BH + 4.0, 1.2, BRASS, 0.65, 12);                            // Part 9: Edge WAF filter capacitor 1
  vc(33.2, 134, BH + 0.8, BH + 4.0, 1.2, BRASS, 0.65, 12);                            // Part 10: Edge WAF filter capacitor 2

  // ---- 3. MODULE 2: MARKETING FUNNEL & COUPON STAMP PRESS (x=45..67, y=131..149, Parts 11-17) ----
  // Part 11: Conical Marketing Funnel hopper
  vc(48.5, 143.5, BH + 0.8, BH + 3.0, 1.8, METAL, 0.7, 14);
  put([[45.5, 140.5, BH + 3.0], [51.5, 146.5, BH + 5.8]],
    rod([48.5, 143.5, BH + 3.0], [48.5, 143.5, BH + 5.6], 1.6, CF_ORG, toneI, 0.85, 3.1, 16));
  // Part 12: Marketing funnel traffic sphere dropping in
  {
    const tz = BH + 5.9 - K.lidOpen * 1.4;
    vc(48.5, 143.5, tz - 0.8, tz + 0.4, 0.9, BRASS, 0.6, 10);
  }
  // Part 13: Cart conveyor bed running from Marketing Funnel under Coupon Stamp Press
  bx(51.5, 134, BH + 0.8, 66.5, 142, BH + 1.9, SPACE, 0.75);
  // Part 14 & 15: Coupon Stamp Press twin vertical guide columns & upper yoke bridge
  vc(57.0, 134.8, BH + 1.9, BH + 5.9, 0.65, METAL, 0.6, 10);
  vc(63.0, 134.8, BH + 1.9, BH + 5.9, 0.65, METAL, 0.6, 10);
  bx(56.0, 134.0, BH + 5.2, 64.0, 141.5, BH + 6.2, CRIM, 0.8);
  // Part 16: Plunging -20% Coupon Stamp actuator head
  {
    const dz = K.couponStamp * 2.1;
    bx(57.8, 135.8, BH + 3.2 - dz, 62.2, 140.2, BH + 5.1 - dz, K.couponApplied > 0.3 ? CRIM : BRASS, 0.75);
  }
  // Part 17: Cart coupon ticket on the conveyor bed (stamped crimson when couponApplied > 0.3)
  bx(57.2, 135.6, BH + 1.95, 62.8, 140.4, BH + 2.45, K.couponApplied > 0.3 ? CRIM : CERAMIC, 0.65);

  // ---- 4. MODULE 3: STRIPE VAULT GATE & SETTLEMENT LEDGER CYLINDERS (x=29..42, y=109..128, Parts 18-23) ----
  const paidMat = K.stripePaid > 0.5 ? STRIPE : AIZOME;
  bx(29.5, 116, BH + 0.8, 39.5, 126.5, BH + 5.4, paidMat, 0.85);                      // Part 18: Armored Stripe Vault chamber
  // Part 19: Vault rotary locking gate on front face (x = 39.5..41.2)
  {
    const openShift = K.stripeGate * 2.4;
    bx(39.6, 117.5 - openShift, BH + 1.3, 41.2, 124.5 - openShift, BH + 4.9, METAL, 0.8);
  }
  // Parts 20, 21, 22: 3 Settlement Ledger Cylinders (rise with stripePaid)
  const ledH = 2.6 + K.stripePaid * 1.8;
  vc(31.5, 111.5, BH + 0.8, BH + 0.8 + ledH, 1.35, BRASS, 0.7, 12);                   // Part 20: Ledger cylinder 1
  vc(35.0, 111.5, BH + 0.8, BH + 0.8 + ledH, 1.35, STRIPE, 0.7, 12);                  // Part 21: Ledger cylinder 2
  vc(38.5, 111.5, BH + 0.8, BH + 0.8 + ledH, 1.35, BRASS, 0.7, 12);                   // Part 22: Ledger cylinder 3
  bx(40.2, 110.0, BH + 0.8, 43.2, 114.5, BH + 3.4, PCB_M, 0.7);                       // Part 23: Stripe HSM webhook chip

  // ---- 5. MODULE 4: D1 INVENTORY RACK CAROUSEL & SKU PICKER (x=52..68, y=104..125, Parts 24-29) ----
  bx(53.0, 105.0, BH + 0.8, 67.5, 124.0, BH + 1.5, METAL, 0.75);                      // Part 24: D1 Rack lower shelf
  bx(53.0, 105.0, BH + 3.3, 67.5, 124.0, BH + 3.9, METAL, 0.75);                      // Part 25: D1 Rack upper shelf
  // Parts 26, 27, 28: SKU Bins on the rack (Part 28 slides out +x during Step 3 skuPick!)
  bx(54.5, 118.0, BH + 1.5, 59.5, 122.8, BH + 3.2, KRAFT, 0.7);                       // Part 26: Stock SKU bin A
  bx(54.5, 112.0, BH + 1.5, 59.5, 116.8, BH + 3.2, KRAFT, 0.7);                       // Part 27: Stock SKU bin B
  {
    const dx = K.skuPick * 4.2;
    bx(60.5 + dx, 106.5, BH + 1.5, 65.5 + dx, 111.5, BH + 3.2, AIZOME, 0.75);         // Part 28: Active picked SKU bin (-1 SKU)
  }
  vc(51.2, 107.5, BH + 0.8, BH + 4.4, 1.3, SPACE, 0.7, 12);                           // Part 29: D1 Carousel stepper drive motor

  // ---- 6. MODULE 5: EMAIL PNEUMATIC TUBE RECEIPT LAUNCHER (x=29..49, y=96..106, Parts 30-33) ----
  vc(31.5, 100.5, BH + 0.8, BH + 5.0, 2.1, BRASS, 0.8, 16);                           // Part 30: Pneumatic compressor cylinder
  bx(34.2, 98.5, BH + 0.8, 38.0, 102.5, BH + 4.0, PCB_M, 0.7);                        // Part 31: Solenoid launch valve manifold
  put([[38.0, 98.8, BH + 2.0], [49.0, 102.2, BH + 4.4]],
    cylX(38.0, 49.0, 100.5, BH + 3.2, 1.25, CLEAR, toneI, 0.75, 14));                 // Part 32: Transparent pneumatic dispatch tube
  // Part 33: Glowing Email Confirmation Capsule shooting through the pneumatic tube
  {
    const capX = 38.8 + K.emailPulse * 8.4;
    put([[capX - 1.2, 99.4, BH + 2.2], [capX + 1.2, 101.6, BH + 4.2]],
      cylX(capX - 1.1, capX + 1.1, 100.5, BH + 3.2, 0.9, K.emailPulse > 0.05 ? CF_ORG : BRASS, toneI, 0.7, 12));
  }

  // ---- 7. MODULE 6: USB-C BUS & PITNEY BOWES THERMAL PRINT HEAD / LABEL ROLL (Parts 34-38) ----
  bx(41.5, 94.2, BH + 0.8, 47.5, 98.0, BH + 3.8, AIZOME, 0.75);                       // Part 34: MacBook USB-C Bus controller
  bx(33.0, 78.0, BH + 0.8, 39.5, 83.2, BH + 5.2, PCB_M, 0.75);                        // Part 35: Printer internal USB-C logic board
  // Part 36: Internal 4x6 Label Roll media spool inside Pitney Bowes printer
  {
    let roll = '';
    const r0 = 5.0 - K.labelFlight * 0.4;
    const A = on(PY(60), ellUV(29, BH + 8.5, r0, r0, 20));
    const B = on(PY(76), ellUV(29, BH + 8.5, r0, r0, 20));
    roll += loft(A, B, nr => toneI(nr, CERAMIC)) + fill(pd(A), CERAMIC.l) + fill(pd(B), CERAMIC.m) + hullInk([...A, ...B], 1.0);
    // Inner cardboard core
    const C0 = on(PY(59.5), ellUV(29, BH + 8.5, 1.8, 1.8, 14));
    const C1 = on(PY(76.5), ellUV(29, BH + 8.5, 1.8, 1.8, 14));
    roll += loft(C0, C1, nr => toneI(nr, KRAFT)) + fill(pd(C0), KRAFT.d);
    put([[23.5, 59.5, BH + 3.0], [34.5, 76.5, BH + 14.0]], roll);
  }
  // Part 37: Rubber platen drive roller & brass stepper gear
  {
    const A = on(PY(59), ellUV(43.5, BH + 8.2, 2.2, 2.2, 16));
    const B = on(PY(77), ellUV(43.5, BH + 8.2, 2.2, 2.2, 16));
    const s = loft(A, B, nr => toneI(nr, DARK)) + fill(pd(A), BRASS.l) + hullInk([...A, ...B], 0.9);
    put([[41.0, 59.0, BH + 5.8], [46.0, 77.0, BH + 10.6]], s);
  }
  // Part 38: Heated Thermal Print Head bar above platen roller (glows amber-red during Step 4)
  bx(41.5, 59.0, BH + 11.0, 46.2, 77.0, BH + 13.5, K.printHeat > 0.1 ? CRIM : CF_ORG, 0.85);

  // ---- PORT-TO-PORT INTERNAL WIRING HARNESSES ----
  const liveCol = K.stripePaid > 0.3 ? '#f79640' : '#3a4654';
  parts.push(...wireSegs([[34.0, 143.0, BH + 1.6], [45.5, 143.0, BH + 1.6]], '#f79640', 0.45));
  parts.push(...wireSegs([[57.0, 134.0, BH + 1.4], [48.0, 125.0, BH + 1.4], [39.5, 121.0, BH + 1.4]], liveCol, 0.45));
  parts.push(...wireSegs([[39.5, 118.0, BH + 1.4], [53.0, 115.0, BH + 1.4]], K.stripePaid > 0.5 ? '#2ea874' : '#3a4654', 0.45));
  parts.push(...wireSegs([[47.5, 116.0, BH + 1.3], [44.5, 102.0, BH + 1.3], [38.0, 100.5, BH + 1.3]], K.emailPulse > 0.05 ? '#f2c96b' : '#3a4654', 0.45));
  parts.push(...wireSegs([[53.0, 108.0, BH + 1.2], [44.5, 98.0, BH + 1.2]], K.printHeat > 0.05 ? '#f79640' : '#3568b0', 0.5));

  return byDepth(parts);
}

/* ---------- 1. MACBOOK PRO (Hinged Lid 0°..110° + Live DinkusKit Storefront) ---------- */
function drawMacbookBase(st, K, m){
  const x0 = 24, x1 = 72, y0 = 94, y1 = 152, z0 = BH, z1 = BH + 6.5;
  const prof = rrUV(y0, z0, y1, z1, 1.4, 5);
  let body = '';
  const FRONT = facing([1, 0, 0]), BACK = facing([-1, 0, 0]), RIGHT = facing([0, -1, 0]), LEFT = facing([0, 1, 0]);

  body += extrude(prof, x0, x1, ALUM, tone);
  if (FRONT){
    body += shape(on(PX(x1), prof), tone([1, 0, 0], ALUM), 1.0);
    // Front thumb notch indent on the unibody lip
    body += shape(on(PX(x1 + 0.06), rectUV(116, z1 - 1.3, 130, z1)), SPACE.d, 0.6);
  }
  if (BACK){
    body += shape(on(PX(x0), prof), tone([-1, 0, 0], ALUM), 1.0);
    // Rear thermal exhaust vents & model engraving
    for (let y = 104; y <= 140; y += 6){
      body += shape(on(PX(x0 - 0.06), rectUV(y, z0 + 1.8, y + 3.5, z0 + 3.4)), SPACE.d, 0.5);
    }
  }
  if (RIGHT){
    // Right side (y = y0 = 94): Two USB-C Thunderbolt ports + headphone jack
    body += shape(on(PY(y0 - 0.05), rrUV(36, z0 + 2.2, 39.5, z0 + 3.8, 0.5)), SPACE.d, 0.6);
    body += shape(on(PY(y0 - 0.05), rrUV(42.5, z0 + 2.2, 46.0, z0 + 3.8, 0.5)), CF_ORG.m, 0.6);
  }
  if (LEFT){
    // Left side (y = y1 = 152): MagSafe 3 port + dual USB-C ports
    body += shape(on(PY(y1 + 0.05), rrUV(30, z0 + 2.2, 34, z0 + 3.8, 0.5)), BRASS.m, 0.6);
    body += shape(on(PY(y1 + 0.05), rrUV(37, z0 + 2.2, 40.5, z0 + 3.8, 0.5)), SPACE.d, 0.6);
  }

  // Top deck: recessed black magic keyboard well + speaker grilles + Force Touch trackpad
  const topFace = on(PZ(z1 + 0.02), rrUV(x0 + 1.2, y0 + 1.2, x1 - 1.2, y1 - 1.2, 2.2));
  body += fill(pd(topFace), ALUM.l) + ink(pd(topFace), 0.8);
  // Keyboard well (x = 29..54, y = 100..146)
  const kbWell = on(PZ(z1 + 0.06), rrUV(29, 100, 54, 146, 1.2));
  body += shape(kbWell, '#1e2229', 0.8);
  // Keycap rows inside keyboard well
  for (let r = 0; r < 5; r++){
    const rx0 = 30.2 + r * 4.6, rx1 = rx0 + 3.7;
    for (let c = 0; c < 10; c++){
      const cy0 = 101.5 + c * 4.35, cy1 = cy0 + 3.6;
      body += fill(pd(on(PZ(z1 + 0.1), rectUV(rx0, cy0, rx1, cy1))), '#2d333d');
    }
  }
  // Force Touch Trackpad (x = 56..69, y = 112..134)
  body += shape(on(PZ(z1 + 0.06), rrUV(56, 112, 69, 134, 1.2)), '#cfd6de', 0.75);
  body += hullInk([...on(PX(x0), prof), ...on(PX(x1), prof)], 2.4);

  const k = ease(st.xr || 0);
  if (k > 0){
    body = xrGhost(body, '', k, prof, x0, x1, ALUM) + `<g opacity="${f(k)}">${commerceMech(st, K)}</g>`;
  }
  return act('macbook', body);
}

function drawMacbookLid(st, K, m){
  // Hinges along rear edge (xH = 25.5, y = 94..152, zH = BH + 6.6)
  // Lid angle: 0 deg = flat closed over base (t=0); 110 deg = open angled back
  const xH = 25.5, y0 = 94, y1 = 152, zH = BH + 6.6;
  const deg = K.lidOpen * 110;
  const rad = deg * Math.PI / 180;
  const L_lid = 45.5, T_lid = 1.6;
  // Unit vector u along lid from hinge toward top edge; n normal pointing from screen toward outer shell
  const ux = Math.cos(rad), uz = Math.sin(rad);
  const nx = -Math.sin(rad), nz = Math.cos(rad);
  const lidPt = (s, y, w) => [xH + s * ux + w * nx, y, zH + s * uz + w * nz];

  const c000 = lidPt(0, y0, 0), c100 = lidPt(L_lid, y0, 0), c110 = lidPt(L_lid, y1, 0), c010 = lidPt(0, y1, 0);
  const c001 = lidPt(0, y0, T_lid), c101 = lidPt(L_lid, y0, T_lid), c111 = lidPt(L_lid, y1, T_lid), c011 = lidPt(0, y1, T_lid);

  const innerFace = [c000, c100, c110, c010];
  const outerFace = [c001, c011, c111, c101];
  const screenNorm = [-nx, 0, -nz];
  const backNorm   = [nx, 0, nz];
  const screenVis  = vis(screenNorm);

  let s = '';
  // Draw back/outer shell + perimeter rim
  s += loft(innerFace, [c001, c101, c111, c011], nr => tone(nr, ALUM));
  if (vis(backNorm)){
    s += shape(outerFace, tone(backNorm, ALUM), 1.0);
    // DinkusKit diamond emblem on outer aluminum lid (visible when closed at t=0 or from behind!)
    const em = [
      lidPt(L_lid * 0.44, 123, T_lid + 0.06),
      lidPt(L_lid * 0.50, 118.5, T_lid + 0.06),
      lidPt(L_lid * 0.56, 123, T_lid + 0.06),
      lidPt(L_lid * 0.50, 127.5, T_lid + 0.06),
    ];
    s += shape(em, AIZOME.l, 0.8);
  }

  // Inner Retina Display when facing viewer and lid is opening
  if (screenVis && K.lidOpen > 0.04){
    s += shape(innerFace, '#141821', 1.0);
    const padS = 2.6, padY = 2.8;
    const scr = [
      lidPt(padS, y0 + padY, -0.05),
      lidPt(L_lid - padS, y0 + padY, -0.05),
      lidPt(L_lid - padS, y1 - padY, -0.05),
      lidPt(padS, y1 - padY, -0.05),
    ];
    s += shape(scr, K.screenOn > 0.1 ? '#f4f1ea' : '#1d2430', 0.8);

    if (K.screenOn > 0.15){
      // Top Storefront Header Bar on the Retina Display (near s = L_lid - 5)
      const hdr = [
        lidPt(L_lid - 7.5, y0 + padY + 0.8, -0.09),
        lidPt(L_lid - 3.2, y0 + padY + 0.8, -0.09),
        lidPt(L_lid - 3.2, y1 - padY - 0.8, -0.09),
        lidPt(L_lid - 7.5, y1 - padY - 0.8, -0.09),
      ];
      s += fill(pd(hdr), '#1b222c');

      // Left Storefront Product Card (y = 124..147, s = 10..35)
      const cardL = [
        lidPt(10, 124, -0.09),
        lidPt(35, 124, -0.09),
        lidPt(35, 147, -0.09),
        lidPt(10, 147, -0.09),
      ];
      s += shape(cardL, '#e4dfd3', 0.65);

      // Product preview icon inside storefront card
      const prodIcon = [
        lidPt(17, 130, -0.13),
        lidPt(29, 130, -0.13),
        lidPt(29, 141, -0.13),
        lidPt(17, 141, -0.13),
      ];
      s += shape(prodIcon, AIZOME.l, 0.6);

      // Right Checkout & Order Status Panel (y = 98..121, s = 10..35)
      const cardR = [
        lidPt(10, 98, -0.09),
        lidPt(35, 98, -0.09),
        lidPt(35, 121, -0.09),
        lidPt(10, 121, -0.09),
      ];
      s += shape(cardR, '#ffffff', 0.65);

      // Coupon Badge (-20% SAVE20) when stamped in Step 1
      if (K.couponApplied > 0.2){
        const cpn = [
          lidPt(26, 100, -0.14),
          lidPt(33, 100, -0.14),
          lidPt(33, 119, -0.14),
          lidPt(26, 119, -0.14),
        ];
        s += shape(cpn, CRIM.l, 0.65);
      }

      // Stripe Paid / Fulfilled Status Banner inside checkout panel
      const payCol = K.mailLaunch > 0.5 ? '#2b5b9e' : K.stripePaid > 0.4 ? '#2ea874' : '#f4b829';
      const payBar = [
        lidPt(12, 100, -0.14),
        lidPt(19, 100, -0.14),
        lidPt(19, 119, -0.14),
        lidPt(12, 119, -0.14),
      ];
      s += shape(payBar, payCol, 0.65);

      // Crisp 3D text projected directly on the angled Retina display plane
      const txLid = (sPos, yPos, wOff, str, sz, col, weight = 800) => {
        const o = P(...lidPt(sPos, yPos, wOff));
        return `<text transform="${txM(o, Dv(0, -1, 0), Dv(-ux, 0, -uz))}" font-size="${sz}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`;
      };
      s += txLid(L_lid - 5.8, 123, -0.18, 'DINKUSKIT.STORE', 2.5, '#f4f1ea', 800);

      if (K.couponApplied > 0.2){
        s += txLid(29.0, 109.5, -0.2, '-20% PROMO', 2.2, '#ffffff', 800);
      }
      const statusStr = K.mailLaunch > 0.5 ? 'COMPLETED' : K.stripePaid > 0.4 ? 'PAID $68' : 'ORDER #1042';
      const statusCol = K.mailLaunch > 0.5 || K.stripePaid > 0.4 ? '#ffffff' : '#1b222c';
      s += txLid(15.0, 109.5, -0.2, statusStr, 2.2, statusCol, 800);
    }
  }

  s += hullInk([...innerFace, ...outerFace], 2.2);
  const allPts = [...innerFace, ...outerFace];
  return {
    box: boxOfPts(allPts, 0.2),
    svg: act('macbook', s),
  };
}

function drawThermalPrinter(st, K){
  const x0 = 20, x1 = 52, y0 = 54, y1 = 84, z0 = BH, z1 = BH + 20;

  const FRONT = facing([1, 0, 0]), TOP = facing([0, 0, 1]), BACK = facing([-1, 0, 0]);
  let body = extrude(prof, x0, x1, CERAMIC, tone);

  if (FRONT){
    body += shape(on(PX(x1), prof), tone([1, 0, 0], CERAMIC), 1.0);
    // Front dark slate face plate & 4x6 label exit mouth slot
    body += shape(on(PX(x1 + 0.05), rrUV(y0 + 3, z0 + 4, y1 - 3, z1 - 3, 2)), AIZOME.d, 0.8);
    body += shape(on(PX(x1 + 0.1), rectUV(58, BH + 10.2, 80, BH + 12.2)), '#12161f', 0.7);
    // Status LED (green when ready, glowing orange when printing)
    const ledCol = K.printHeat > 0.05 ? '#f79640' : '#2ea874';
    body += shape(on(PX(x1 + 0.12), ellUV(60, BH + 15.2, 1.3, 1.3, 10)), ledCol, 0.5);
    body += tx(x1 + 0.18, 69, BH + 6.5, 'PITNEY BOWES 4x6', 2.4, '#f4f1ea', 800);
  }
  if (BACK){
    body += shape(on(PX(x0), prof), tone([-1, 0, 0], CERAMIC), 1.0);
    body += shape(on(PX(x0 - 0.05), rrUV(60, z0 + 4, 78, z0 + 12, 1.2)), SPACE.m, 0.7);
  }
  if (TOP){
    // Translucent top inspection window on clamshell lid
    const win = on(PZ(z1 + 0.05), rrUV(x0 + 6, y0 + 6, x1 - 8, y1 - 6, 2));

  }
  body += hullInk([...on(PX(x0), prof), ...on(PX(x1), prof)], 2.4);

  const k = ease(st.xr || 0);
  if (k > 0){
    body = xrGhost(body, '', k, prof, x0, x1, CERAMIC);

  return {
    box: [[x0, y0, z0], [x1 + 0.5, y1, z1 + 0.5]],
    svg: act('printer', body),

/* ---------- 3. ORDERED DINKUSKIT PRODUCT & CORRUGATED SHIPPING BOX (openShell + 4 Flaps + Tape + 4×6 Label) ---------- */
function drawProductSvg(cx, cy, zBot){

  const h = 9.5, r = 4.6;
  let s = '';
  // Indigo presentation box base + brass band + ceramic lid knob
  s += box(cx - 5.2, cy - 5.2, zBot, cx + 5.2, cy + 5.2, zBot + h, AIZOME, tone, 0.95);
  s += box(cx - 5.3, cy - 5.3, zBot + h * 0.42, cx + 5.3, cy + 5.3, zBot + h * 0.62, BRASS, toneI, 0.7);
  s += cyl(cx, cy, zBot + h, zBot + h + 1.8, r * 0.45, BRASS, toneI, 0.8, 14);
  if (facing([0, 0, 1])){
    s += fill(pd(on(PZ(zBot + h + 0.05), rectUV(cx - 3.5, cy - 3.5, cx + 3.5, cy + 3.5))), '#f4f1ea');

function drawShippingBoxAndProduct(K){
  const parts = [];
  // Box base position on packing station (x = 60..88, y = 36..62, z = BH..BH+18)
  // In Step 5 (mailLaunch = 0..1), the sealed & labeled box slides across the desk into the Mail Chute at y = 12..32!
  const slideY = -K.mailLaunch * 25.0;
  const dropZ  = K.mailLaunch > 0.65 ? -((K.mailLaunch - 0.65) / 0.35) * 2.2 : 0;

  const bx0 = 60, bx1 = 88;
  const by0 = 36 + slideY, by1 = 62 + slideY;
  const bz0 = BH + Math.max(0, dropZ), bz1 = bz0 + 18;
  const bCx = (bx0 + bx1) / 2, bCy = (by0 + by1) / 2;

  // Staging pad where product waits before Step 3 (x = 65..83, y = 66..82, z = BH..BH+1.2)
  parts.push({
    box: [[65, 66, BH], [83, 82, BH + 1.3]],
    svg: box(65, 66, BH, 83, 82, BH + 1.2, SPACE, toneI, 0.8),
  });

  // Product trajectory in Step 3 (packProgress = 0..1):
  // From staging pad (x=74, y=74, z=BH+1.2) -> parabolic arc over box rim (z_peak = BH+25) -> nested inside box (x=74, y=49, z=BH+1.0)
  const pk = K.packProgress;
  const prodY = lerp(74, bCy, pk);
  const prodZ = lerp(BH + 1.2, bz0 + 1.0, pk) + Math.sin(pk * Math.PI) * 18.5;

  // If product has not yet crossed over the box rim (pk < 0.62), draw it as its own depth-sorted part above/beside the box;
  // Once it drops into the open box (pk >= 0.62), render it as `contents` inside `openShell` so the open cardboard walls wrap around it!
  const nestedInBox = pk >= 0.62;
  if (!nestedInBox){
    parts.push({
      box: [[bCx - 5.5, prodY - 5.5, prodZ], [bCx + 5.5, prodY + 5.5, prodZ + 11.5]],
      svg: act('box', drawProductSvg(bCx, prodY, prodZ)),
    });
  }

  // Open-top corrugated cardboard shipping box using core.js openShell(A, B, colour, contents)
  const A = on(PZ(bz0), rectUV(bx0, by0, bx1, by1));
  const B = on(PZ(bz1), rectUV(bx0, by0, bx1, by1));
  const floorSvg = fill(pd(A), KRAFT.d);
  const innerContents = floorSvg + (nestedInBox && K.flapFold < 0.95 ? drawProductSvg(bCx, bCy, prodZ) : '');
  let boxSvg = openShell(A, B, nr => tone(nr, KRAFT), innerContents);
  boxSvg += hullInk([...A, ...B], 2.0);

  // 4 Hinged Top Cardboard Flaps along the rim z = bz1:
  // flapFold = 0 (open outward/upward at 20 deg) -> flapFold = 1 (folded flat closed at 90 deg horizontal over the box mouth!)
  const fk = K.flapFold;
  const halfX = (bx1 - bx0) / 2; // 14
  const halfY = (by1 - by0) / 2; // 13
  // Side flaps (Left y=by1 and Right y=by0) fold inward first; Front (x=bx1) and Back (x=bx0) flaps fold cleanly on top
  const angSide = (-25 + fk * 115) * Math.PI / 180; // -25 deg (open) -> +90 deg (flat horizontal)
  const angFB   = (-20 + fk * 110) * Math.PI / 180;

  const sInY = Math.sin(angSide) * (halfY - 0.4), sUpY = Math.cos(angSide) * (halfY - 0.4) * (1 - fk * 0.98);
  const sInX = Math.sin(angFB) * (halfX - 0.2),   sUpX = Math.cos(angFB) * (halfX - 0.2) * (1 - fk * 0.98);

  // Left flap (hinged at y = by1, folds toward -y)
  const flapL = [
    [bx0 + 0.4, by1, bz1],
    [bx1 - 0.4, by1, bz1],
    [bx1 - 0.4, by1 - Math.max(-3, sInY), bz1 + sUpY],
    [bx0 + 0.4, by1 - Math.max(-3, sInY), bz1 + sUpY],
  ];
  // Right flap (hinged at y = by0, folds toward +y)
  const flapR = [
    [bx0 + 0.4, by0, bz1],
    [bx1 - 0.4, by0, bz1],
    [bx1 - 0.4, by0 + Math.max(-3, sInY), bz1 + sUpY],
    [bx0 + 0.4, by0 + Math.max(-3, sInY), bz1 + sUpY],
  ];
  // Back flap (hinged at x = bx0, folds toward +x)
  const flapB = [
    [bx0, by0, bz1 + 0.15],
    [bx0, by1, bz1 + 0.15],
    [bx0 + Math.max(-3, sInX), by1, bz1 + 0.15 + sUpX],
    [bx0 + Math.max(-3, sInX), by0, bz1 + 0.15 + sUpX],
  ];
  // Front flap (hinged at x = bx1, folds toward -x)
  const flapF = [
    [bx1, by0, bz1 + 0.15],
    [bx1, by1, bz1 + 0.15],
    [bx1 - Math.max(-3, sInX), by1, bz1 + 0.15 + sUpX],
    [bx1 - Math.max(-3, sInX), by0, bz1 + 0.15 + sUpX],
  ];

  if (fk < 0.85){
    boxSvg += shape(flapL, KRAFT.m, 0.85) + shape(flapR, KRAFT.m, 0.85);
  }
  boxSvg += shape(flapB, KRAFT.l, 0.95) + shape(flapF, KRAFT.l, 0.95);
  if (fk >= 0.85){
    // Center seam line between front and back flaps
    boxSvg += line([[bCx, by0, bz1 + 0.2], [bCx, by1, bz1 + 0.2]], 1.0);
  }

  // Step 4b: Kraft Packing Tape strip sweeping across top seam (tapeSeal = 0..1)
  if (K.tapeSeal > 0.02){
    const tk = K.tapeSeal;
    const ty0 = by0 + 10.0, ty1 = by1 - 10.0;
    const txEnd = bx0 + (bx1 - bx0) * tk;
    const topTape = on(PZ(bz1 + 0.28), rectUV(bx0, ty0, txEnd, ty1));
    boxSvg += shape(topTape, TAPE_M.l, 0.75);
    // Front lip overhang once tape reaches front edge
    if (tk > 0.85 && facing([1, 0, 0])){
      const lipH = ((tk - 0.85) / 0.15) * 4.5;
      boxSvg += shape(on(PX(bx1 + 0.08), rectUV(ty0, bz1 - lipH, ty1, bz1 + 0.25)), TAPE_M.m, 0.65);
    }
  }

  // Front fragile / DinkusKit stencil on box front wall
  if (facing([1, 0, 0])){
    boxSvg += tx(bx1 + 0.12, bCy, bz0 + 8.5, 'DINKUSKIT', 2.8, INK, 800);
    boxSvg += tx(bx1 + 0.12, bCy, bz0 + 5.0, 'ORD #1042', 2.2, KRAFT.d, 700);
  }

  parts.push({
    box: [[bx0 - 3, by0 - 3, bz0], [bx1 + 3, by1 + 3, bz1 + 10]],
    svg: act('box', boxSvg),
  });

  // Step 4c: Pitney Bowes 4x6 Thermal Shipping Label ejecting from printer & slapping onto the sealed box!
  if (K.labelFlight > 0.01){
    const lk = K.labelFlight;
    // Start at printer exit slot (x=53, y=69, z=BH+11.2); land flat on sealed box top (x=76, y=bCy, z=bz1+0.42)
    const lx = lerp(54, bCx + 3.5, lk);
    const ly = lerp(69, bCy, lk);
    const lz = lerp(BH + 11.2, bz1 + 0.42, lk) + Math.sin(lk * Math.PI) * 9.5;
    const lw = 9.0, ld = 13.0; // 4x6 proportion
    const lblPts = on(PZ(lz), rectUV(lx - lw/2, ly - ld/2, lx + lw/2, ly + ld/2));
    let lblSvg = shape(lblPts, '#ffffff', 0.95);
    // Red Pitney Bowes postage header strip
    lblSvg += fill(pd(on(PZ(lz + 0.04), rectUV(lx + lw/2 - 2.2, ly - ld/2 + 0.8, lx + lw/2 - 0.7, ly + ld/2 - 0.8))), CRIM.l);
    // Bold 'P' priority icon box
    lblSvg += shape(on(PZ(lz + 0.04), rectUV(lx + 0.2, ly + 1.5, lx + 2.4, ly + 5.2)), '#ffffff', 0.5);
    // Barcode stripes across lower half of 4x6 label
    for (let i = 0; i < 7; i++){
      const by = ly - ld/2 + 1.4 + i * 1.45;
      lblSvg += line([[lx - lw/2 + 1.2, by, lz + 0.06], [lx - 0.4, by, lz + 0.06]], i % 2 === 0 ? 1.1 : 0.65);
    }
    parts.push({
      box: [[lx - lw/2 - 0.5, ly - ld/2 - 0.5, lz - 0.2], [lx + lw/2 + 0.5, ly + ld/2 + 0.5, lz + 1.5]],
      svg: act('box', lblSvg),
    });
  }

  return parts;
}

/* ---------- 4. OUTGOING MAIL CHUTE / DISPATCH HOPPER (Right Side of Desk) ---------- */
function drawMailChute(K){
  const x0 = 56, x1 = 92, y0 = 4, y1 = 22, z0 = BH, z1 = BH + 28;
  // Main dispatch tower housing
  let s = box(x0, y0, z0, x1, y1, z1, AIZOME, tone, 1.1);
  // Brass intake frame on the +y face (y = y1 = 22, facing the shipping box)
  if (facing([0, 1, 0])){
    s += shape(on(PY(y1 + 0.06), rrUV(x0 + 2.5, z0 + 2.0, x1 - 2.5, z1 - 4.0, 2.0)), BRASS.l, 0.9);
    // Dark recessed mail drop cavity
    s += shape(on(PY(y1 + 0.12), rectUV(x0 + 4.5, z0 + 3.0, x1 - 4.5, z1 - 7.0)), '#10151f', 0.8);
    // Swinging brass mail chute flap
    const swing = K.chuteFlap * 3.5;
    s += shape([
      [x0 + 4.8, y1 + 0.16, z1 - 4.2],
      [x1 - 4.8, y1 + 0.16, z1 - 4.2],
      [x1 - 4.8, y1 + 0.16 - swing, z1 - 9.5 + swing * 0.4],
      [x0 + 4.8, y1 + 0.16 - swing, z1 - 9.5 + swing * 0.4],
    ], BRASS.m, 0.75);
  }
  if (facing([1, 0, 0])){
    // Front plaque & dispatch status indicator on mail chute
    s += shape(on(PX(x1 + 0.06), rrUV(y0 + 2.5, z1 - 9.5, y1 - 2.5, z1 - 2.5, 1.2)), '#f4f1ea', 0.75);
    s += tx(x1 + 0.14, (y0 + y1)/2, z1 - 5.5, 'MAIL CHUTE', 2.4, INK, 800);
    const doneCol = K.mailLaunch > 0.8 ? '#2ea874' : '#d5cec0';
    s += shape(on(PX(x1 + 0.08), ellUV((y0 + y1)/2, z0 + 11, 2.2, 2.2, 14)), doneCol, 0.7);
  }
  // Angled dispatch roof cap
  const roofA = on(PZ(z1), rectUV(x0, y0, x1, y1));
  const roofB = on(PZ(z1 + 3.5), rectUV(x0 + 3, y0 + 2, x1 - 3, y1 - 2));
  s += loft(roofA, roofB, nr => tone(nr, BRASS)) + fill(pd(roofB), BRASS.l) + hullInk([...roofA, ...roofB], 1.6);
  s += hullInk([...on(PZ(z0), rectUV(x0, y0, x1, y1)), ...roofB], 2.2);

  return {
    box: [[x0, y0, z0], [x1 + 0.5, y1 + 0.5, z1 + 4]],
    svg: act('chute', s),
  };
}

/* ---------- MAIN SCENE COMPOSITOR ---------- */
function scene(st, m){
  const K = deriveKinematics(st.t || 0);
  const k = ease(st.xr || 0);

  // 1. Mode B Multiplane Horizon + Pigment Drift Backdrop at top of stage
  let s = renderMultiplaneBackdrop(st, K);

  // 2. Studio Desk Board + Cast Shadows
  s += board(0, 0, BW, BD, BH, 6, BOARD);

  const shadowcasterPts = [
    ...on(PZ(BH), rectUV(24, 94, 72, 152)),
    ...on(PZ(BH + 10), rectUV(24, 94, 72, 152)),
    ...on(PZ(BH), rectUV(20, 54, 52, 84)),
    ...on(PZ(BH + 20), rectUV(20, 54, 52, 84)),
    ...on(PZ(BH), rectUV(56, 4, 92, 22)),
    ...on(PZ(BH + 28), rectUV(56, 4, 92, 22)),
  ];
  s += clipTo(BTOP, castShadow(shadowcasterPts, BH));

  // 3. Depth-sorted 3D Desk Assemblies (MacBook Base, Hinged Lid, USB-C Cable, Thermal Printer, Box+Product, Mail Chute)
  const deskParts = [
    {
      box: [[24, 94, BH], [72, 152, BH + 6.6]],
      svg: drawMacbookBase(st, K, m),
    },
    drawMacbookLid(st, K, m),
    drawUsbCable(K),
    drawThermalPrinter(st, K),
    ...drawShippingBoxAndProduct(K),
    drawMailChute(K),
  ];
  s += byDepth(deskParts);

  // 4. Live Callout Labels (See-through Mode vs Surface Mode)
  const bounds = [0, BW, 0, BD, 0, H];
  if (k > 0.6){
    s += xrCallouts([
      { at: [37.5, 137.5, BH + 5.0], text: 'CLOUDFLARE EDGE',     on: K.lidOpen > 0.3 },
      { at: [48.5, 143.5, BH + 5.5], text: 'MARKETING FUNNEL',    on: K.lidOpen > 0.2 && K.t < 0.3 },
      { at: [60.0, 138.0, BH + 6.0], text: 'COUPON STAMP PRESS',  on: K.couponApplied > 0.2 && K.t < 0.35 },
      { at: [34.5, 121.0, BH + 5.2], text: 'STRIPE VAULT',        on: K.stripePaid > 0.3 },
      { at: [61.0, 114.0, BH + 3.8], text: 'D1 INVENTORY RACK',   on: K.skuPick > 0.1 },
      { at: [43.0, 100.5, BH + 3.5], text: 'EMAIL PNEUMATIC TUBE',on: K.emailPulse > 0.05 },
      { at: [44.0, 95.5,  BH + 3.5], text: 'USB-C BUS',           on: K.printHeat > 0.05 || K.labelFlight > 0.05 },
      { at: [43.5, 68.0,  BH + 13.0],text: 'THERMAL PRINT HEAD',  on: K.printHeat > 0.05 },
      { at: [29.0, 68.0,  BH + 11.0],text: 'LABEL ROLL',          on: K.labelFlight > 0.05 },
    ], bounds);
  } else {
    const lidZ = BH + 6.6 + Math.sin(K.lidOpen * 110 * Math.PI / 180) * 32;
    const boxY = 49 - K.mailLaunch * 25;
    s += xrCallouts([
      { at: [48, 123, Math.max(BH + 8, lidZ)], text: K.lidOpen < 0.1 ? 'MACBOOK (CLOSED)' : 'DINKUSKIT STOREFRONT', on: K.screenOn > 0.2 },
      { at: [36, 69,  BH + 20],                text: 'THERMAL PRINTER (4x6)', on: K.printHeat > 0.05 || K.labelFlight > 0.1 },
      { at: [74, boxY, BH + 19],               text: K.tapeSeal > 0.5 ? 'TAPED & LABELED BOX' : 'CORRUGATED BOX', on: K.packProgress > 0.1 },
      { at: [74, 13,  BH + 26],                text: 'OUTGOING MAIL CHUTE',   on: K.mailLaunch > 0.2 },
    ], bounds);
  }

  return s;
}

const xrCaption = st => {
  const K = deriveKinematics(st.t || 0);
  if (K.mailLaunch > 0.3) return 'Step 5 (Completed): The taped and labeled 4×6 parcel launches into the outgoing mail chute while the courier van crosses the multiplane viaduct to the customer.';
  if (K.flapFold > 0.1) return 'Step 4 (Tape & Thermal Label): The 4 corrugated box flaps fold 90°, kraft tape seals the center seam, and the Pitney Bowes thermal print head burns and slaps a 4×6 barcode label onto the box.';
  if (K.packProgress > 0.1) return 'Step 3 (Inventory & Pack): The D1 Inventory Rack slides out a SKU (-1 stock), the Email Pneumatic Tube fires the receipt capsule, and the ordered ceramic kettle drops into the open cardboard box.';
  if (K.stripeGate > 0.1) return 'Step 2 (Stripe Vault): Checkout spins the Cloudflare Edge turbine and swings open the internal Stripe Vault gate, settling $68.00 net into the brass ledger cylinders.';
  if (K.lidOpen > 0.05) return 'Step 1 (Order In): The MacBook lid hinges open to 110°, lighting up the DinkusKit storefront. Customer traffic enters the Marketing Funnel and the Coupon Stamp Press stamps -20% (SAVE20).';
  return 'Closed MacBook Ready State (t = 0): Click a step button or Auto-Play to hinge open the MacBook and watch the internal 38-part Commerce Factory fulfill an order end-to-end.';
};

/* ---------- TIMELINE ANIMATION CONTROLLER ---------- */
let ui, animId = 0;

function syncChoreoBar(st){
  const root = (ui && ui.rootEl) || document;
  const t = clamp01(st.t || 0);
  const slider = root.querySelector('#dk-slider');
  const timeEl = root.querySelector('#dk-time');
  if (slider) slider.value = String(t);
  if (timeEl) timeEl.textContent = `T = ${t.toFixed(2)}`;
  root.querySelectorAll('.dk-cue').forEach(btn => {
    const r0 = +btn.dataset.r0, r1 = +btn.dataset.r1;
    btn.setAttribute('data-active', String(t >= r0 && t <= r1));
    btn.setAttribute('data-passed', String(t > r1));
  });
}

function animateToTime(st, targetT, ms = 900){
  st.autoPlay = false;
  const t0 = st.t || 0, dtTotal = clamp01(targetT) - t0, id = ++animId;
  if (Math.abs(dtTotal) < 1e-4){
    st.t = clamp01(targetT);
    syncChoreoBar(st);
    ui.render();
    return;
  }
  let el = 0;
  ui.animate(dt => {
    if (id !== animId) return false;
    el += dt * 1000;
    const k = Math.min(1, el / ms);
    st.t = clamp01(t0 + dtTotal * easeInOutCubic(k));
    syncChoreoBar(st);
    return k < 1;
  });
}

function toggleAutoPlay(st){
  if (st.autoPlay){
    st.autoPlay = false;
    animId++;
    return;
  }
  if (st.t >= 0.95) st.t = 0;
  st.autoPlay = true;
  const id = ++animId;
  ui.animate(dt => {
    if (!st.autoPlay || id !== animId) return false;
    st.t = clamp01((st.t || 0) + dt / 9.5);
    syncChoreoBar(st);
    if (st.t >= 1){
      st.autoPlay = false;
      return false;
    }
    return true;
  });
}

ui = mountFigure({
  fig: '07',
  turn: 'full',
  title: 'DinkusKit — Commerce Inside the MacBook',
  idea: 'Every DinkusKit order triggers a physical chain reaction: Cloudflare Edge routing, a -20% coupon press, Stripe Vault settlement, D1 SKU picking, email dispatch, box packing & taping, a 4×6 Pitney Bowes thermal label slap, and mail chute dispatch.',
  size: [BW, BD, H],
  center: [BW / 2, BD / 2],
  palette: 'aizome',
  state: { t: 0, autoPlay: false, xr: 0, xrT: 0 },
  scene,
  readout: st => {
    const K = deriveKinematics(st.t || 0);
    if (K.mailLaunch > 0.7) return 'step 5 · parcel in mail chute · order completed';
    if (K.flapFold > 0.1) return 'step 4 · flaps folded · taped · 4x6 label slapped';
    if (K.packProgress > 0.1) return 'step 3 · -1 sku picked · email sent · packed in open box';
    if (K.stripeGate > 0.1) return 'step 2 · cloudflare edge + stripe vault paid ($68.00)';
    if (K.lidOpen > 0.05) return 'step 1 · macbook open (110°) · order in (-20% coupon)';
    return 'step 0 · macbook lid closed (0°) · ready for order';
  },
  stats: st => {
    const K = deriveKinematics(st.t || 0);
    const stageStr = K.mailLaunch > 0.7 ? 'COMPLETED'
      : K.flapFold > 0.1 ? 'LABELED 4×6'
      : K.packProgress > 0.1 ? 'PACKING BOX'
      : K.stripeGate > 0.1 ? 'STRIPE PAID'
      : K.lidOpen > 0.05 ? 'ORDER (-20%)'
      : 'LID CLOSED';
    const netVal = K.stripePaid > 0.01 ? '$' + Math.round(68 * K.stripePaid) : '$0';
    const stockVal = K.skuPick > 0.5 ? '11 SKU' : '12 SKU';
    return [
      { label: 'Order Stage', value: stageStr, small: true },
      { label: 'Stripe Net',  value: netVal },
      { label: 'D1 Inventory',value: stockVal, small: true },
    ];
  },
  buttons: [
    { label: 'Auto-Play Full Order',            onClick: st => toggleAutoPlay(st) },
    { label: '1. Open MacBook & Order In',      onClick: st => animateToTime(st, STEP_TIMES[1]) },
    { label: '2. Authorize Stripe Payment',     onClick: st => animateToTime(st, STEP_TIMES[2]) },
    { label: '3. Pick Inventory & Pack Box',    onClick: st => animateToTime(st, STEP_TIMES[3]) },
    { label: '4. Tape Box & Slap Thermal Label',onClick: st => animateToTime(st, STEP_TIMES[4]) },
    { label: '5. Throw in the Mail',            onClick: st => animateToTime(st, STEP_TIMES[5]) },
    { label: 'Reset (Close Lid)',               onClick: st => animateToTime(st, STEP_TIMES[0], 600) },
  ],
  acts: {
    macbook: st => {
      const next = st.t < 0.10 ? STEP_TIMES[1] : st.t < 0.30 ? STEP_TIMES[2] : STEP_TIMES[0];
      animateToTime(st, next);
    },
    printer: st => animateToTime(st, STEP_TIMES[4]),
    box:     st => animateToTime(st, st.t < 0.50 ? STEP_TIMES[3] : STEP_TIMES[4]),
    chute:   st => animateToTime(st, STEP_TIMES[5]),
  },
  scrub: (st, tNorm) => {
    st.autoPlay = false;
    animId++;
    st.t = clamp01(tNorm);
    syncChoreoBar(st);
  },
  params: (st, q) => {
    if (q.has('step')){
      const s = Math.max(0, Math.min(5, +q.get('step') | 0));
      st.t = STEP_TIMES[s] ?? 0;
    }
    if (q.has('t')){
      st.t = clamp01(+q.get('t') || 0);
    }
  },
});

// Mount Mode C Choreographed Timeline Scrubber Bar below the stage
(() => {
  const rootEl = ui.rootEl || document.body;
  const stageEl = rootEl.querySelector('.stage');
  if (!stageEl) return;
  const bar = document.createElement('div');
  bar.className = 'dk-choreo-bar';
  bar.innerHTML = `
    <div class="dk-cues">
      ${CUES.map(c => `<button class="dk-cue" data-step="${c.step}" data-at="${c.at}" data-r0="${c.range[0]}" data-r1="${c.range[1]}">${c.short}</button>`).join('')}
    </div>
    <div class="dk-scrub">
      <span>CHOREO TIMELINE</span>
      <input id="dk-slider" type="range" min="0" max="1" step="0.005" value="${ui.st.t || 0}" aria-label="Timeline scrubber">
      <span id="dk-time">T = ${(ui.st.t || 0).toFixed(2)}</span>
    </div>
  `;
  stageEl.after(bar);
  bar.querySelectorAll('.dk-cue').forEach(btn => {
    btn.onclick = () => animateToTime(ui.st, +btn.dataset.at);
  });
  const slider = bar.querySelector('#dk-slider');
  slider.oninput = e => {
    ui.setTime(+e.target.value);
  };
  syncChoreoBar(ui.st);
})();

xrMount(() => ui, xrCaption);
</script>
