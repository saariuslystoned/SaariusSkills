name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install tmux
        shell: bash
        run: |
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            brew install tmux
          else
            sudo apt-get update
            sudo apt-get install --yes tmux
          fi

      - name: Run test suite
        run: python -m unittest discover -s tests -q

      - name: Compile agent scripts
        run: python -m compileall -q skills/puppet/scripts skills/herdr-puppet/scripts

      - name: Smoke command surfaces
        run: |
          python skills/grilltrack/scripts/grilltrack_ledger.py --help
          python skills/grilltrack/scripts/validate_picker.py fixtures/frontend-picker/manifest.json
          python skills/puppet/scripts/puppet.py --help
          python skills/puppet/scripts/adapter_lab.py --help
          python skills/herdr-puppet/scripts/herdr_puppet.py --help
